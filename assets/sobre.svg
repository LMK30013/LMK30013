<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 422" width="1200" height="422" role="img" aria-label="Escrevo código, apago código, escrevo de novo. No fim quase sempre funciona. E quando funciona de primeira, eu fico desconfiado. Faço sites, sistemas e automações. Gosto de coisa que resolve problema de verdade e de variável com nome que faz sentido (estou trabalhando nessa parte).">
  <defs>
    <radialGradient id="g" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1150 0) scale(520 300)">
      <stop offset="0" stop-color="#8957e5" stop-opacity=".28"/><stop offset="1" stop-color="#8957e5" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="422" rx="24"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 24px; }
      .line { opacity: 0; animation: in .6s ease-out forwards; }
      @keyframes in { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="422" fill="#0b0f17"/>
    <rect width="1200" height="422" fill="url(#g)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="421" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
  <circle cx="44" cy="40" r="7" fill="#ff5f57"/><circle cx="68" cy="40" r="7" fill="#febc2e"/><circle cx="92" cy="40" r="7" fill="#28c840"/>
  <text x="60" y="88" class="mono" style="font-size:20px"><tspan fill="#3fb950" font-weight="700">$</tspan><tspan fill="#7d8590"> cat sobre-mim.txt</tspan></text>
    <text x="60" y="132" class="mono line" style="animation-delay:0.25s"><tspan fill="#e6edf3">Escrevo código, apago código, escrevo de novo.</tspan></text>
  <text x="60" y="172" class="mono line" style="animation-delay:0.37s"><tspan fill="#e6edf3">No fim quase sempre funciona. E quando funciona de primeira,</tspan></text>
  <text x="60" y="212" class="mono line" style="animation-delay:0.49s"><tspan fill="#e6edf3">eu fico </tspan><tspan fill="#d29922">desconfiado</tspan><tspan fill="#e6edf3">.</tspan></text>
  <text x="60" y="292" class="mono line" style="animation-delay:0.73s"><tspan fill="#e6edf3">Faço </tspan><tspan fill="#58a6ff">sites</tspan><tspan fill="#e6edf3">, </tspan><tspan fill="#58a6ff">sistemas</tspan><tspan fill="#e6edf3"> e </tspan><tspan fill="#58a6ff">automações</tspan><tspan fill="#e6edf3">. Gosto de coisa que</tspan></text>
  <text x="60" y="332" class="mono line" style="animation-delay:0.85s"><tspan fill="#e6edf3">resolve problema de verdade e de variável com nome que faz sentido.</tspan></text>
  <text x="60" y="372" class="mono line" style="animation-delay:0.97s"><tspan fill="#7d8590">// estou trabalhando nessa parte</tspan></text>
