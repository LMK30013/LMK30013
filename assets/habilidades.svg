<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 612" width="1200" height="612" role="img" aria-label="Habilidades: escrever código 80%; entender o código que eu escrevi mês passado 30%; dar nome pra variável 20%; centralizar uma div 100%, finalmente; estimar prazo, ninguém sabe; responder 'dá pra fazer' 132%.">
  <defs>
    <linearGradient id="blue" x1="0" x2="1"><stop offset="0" stop-color="#1f6feb"/><stop offset="1" stop-color="#a371f7"/></linearGradient><linearGradient id="green" x1="0" x2="1"><stop offset="0" stop-color="#238636"/><stop offset="1" stop-color="#3fb950"/></linearGradient><linearGradient id="red" x1="0" x2="1"><stop offset="0" stop-color="#da3633"/><stop offset="1" stop-color="#ff7b72"/></linearGradient><linearGradient id="amber" x1="0" x2="1"><stop offset="0" stop-color="#d29922"/><stop offset="1" stop-color="#f0883e"/></linearGradient>
    <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 612) scale(600 320)">
      <stop offset="0" stop-color="#1f6feb" stop-opacity=".25"/><stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-10%" y="-200%" width="120%" height="500%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="card"><rect width="1200" height="612" rx="24"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .lbl { font-size: 26px; fill: #e6edf3; }
      .note { font-size: 22px; font-weight: 700; }
      .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.1s cubic-bezier(.2,.8,.2,1) forwards; }
      @keyframes grow { to { transform: scaleX(1); } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="612" fill="#0b0f17"/>
    <rect width="1200" height="612" fill="url(#bg)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="611" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
  <circle cx="44" cy="40" r="7" fill="#ff5f57"/><circle cx="68" cy="40" r="7" fill="#febc2e"/><circle cx="92" cy="40" r="7" fill="#28c840"/>
  <text x="60" y="88" class="mono" style="font-size:22px"><tspan fill="#3fb950" font-weight="700">$</tspan><tspan fill="#7d8590"> ./autoavaliacao --sincera</tspan></text>
    <text x="60" y="140" class="mono lbl">Escrever código</text>
  <text x="880" y="140" class="mono note" text-anchor="end" fill="#7d8590">80%</text>
  <rect x="60" y="158" width="820" height="14" rx="7" fill="#ffffff" fill-opacity=".07"/>
  <rect x="60" y="158" width="656" height="14" rx="7" fill="url(#blue)" class="bar" style="animation-delay:0.30s"/>
  <text x="60" y="218" class="mono lbl">Entender o código que eu escrevi mês passado</text>
  <text x="880" y="218" class="mono note" text-anchor="end" fill="#7d8590">30%</text>
  <rect x="60" y="236" width="820" height="14" rx="7" fill="#ffffff" fill-opacity=".07"/>
  <rect x="60" y="236" width="246" height="14" rx="7" fill="url(#blue)" class="bar" style="animation-delay:0.45s"/>
  <text x="60" y="296" class="mono lbl">Dar nome pra variável</text>
  <text x="880" y="296" class="mono note" text-anchor="end" fill="#7d8590">20%</text>
  <rect x="60" y="314" width="820" height="14" rx="7" fill="#ffffff" fill-opacity=".07"/>
  <rect x="60" y="314" width="164" height="14" rx="7" fill="url(#blue)" class="bar" style="animation-delay:0.60s"/>
  <g transform="translate(34 2) rotate(1 60 374)"><text x="60" y="374" class="mono lbl">Centralizar uma div</text><text x="880" y="374" class="mono note" text-anchor="end" fill="#3fb950">100% · finalmente</text><rect x="60" y="392" width="820" height="14" rx="7" fill="#ffffff" fill-opacity=".07"/><rect x="60" y="392" width="820" height="14" rx="7" fill="url(#green)"/></g>
  <text x="60" y="452" class="mono lbl">Estimar prazo</text>
  <text x="880" y="452" class="mono note" text-anchor="end" fill="#f85149">??%</text>
  <rect x="60" y="470" width="820" height="14" rx="7" fill="#ffffff" fill-opacity=".07"/>
  <rect x="60" y="470" width="74" height="14" rx="7" fill="url(#red)" class="bar" style="animation-delay:0.90s"><animate attributeName="width" values="74;262;41;180;74" dur="3.2s" begin="2s" repeatCount="indefinite"/></rect>
  <text x="60" y="530" class="mono lbl">Responder &quot;dá pra fazer&quot;</text>
  <text x="1142" y="530" class="mono note" text-anchor="end" fill="#f0883e">132%</text>
  <rect x="60" y="548" width="820" height="14" rx="7" fill="#ffffff" fill-opacity=".07"/>
  <rect x="60" y="548" width="1082" height="14" rx="7" fill="url(#amber)" class="bar" style="animation-delay:1.05s" filter="url(#glow)"/>
  <line x1="880" y1="542" x2="880" y2="566" stroke="#e6edf3" stroke-opacity=".5" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="1146.4" y1="555" x2="1160" y2="545" stroke="#f0883e" stroke-width="2.5" stroke-linecap="round"><animate attributeName="opacity" values="0;1;0" dur="1.1s" begin="2.20s" repeatCount="indefinite"/></line><line x1="1146.4" y1="555" x2="1162" y2="559" stroke="#f0883e" stroke-width="2.5" stroke-linecap="round"><animate attributeName="opacity" values="0;1;0" dur="1.1s" begin="2.32s" repeatCount="indefinite"/></line><line x1="1146.4" y1="555" x2="1154" y2="569" stroke="#f0883e" stroke-width="2.5" stroke-linecap="round"><animate attributeName="opacity" values="0;1;0" dur="1.1s" begin="2.44s" repeatCount="indefinite"/></line><line x1="1146.4" y1="555" x2="1150" y2="541" stroke="#f0883e" stroke-width="2.5" stroke-linecap="round"><animate attributeName="opacity" values="0;1;0" dur="1.1s" begin="2.56s" repeatCount="indefinite"/></line><line x1="1146.4" y1="555" x2="1164" y2="552" stroke="#f0883e" stroke-width="2.5" stroke-linecap="round"><animate attributeName="opacity" values="0;1;0" dur="1.1s" begin="2.68s" repeatCount="indefinite"/></line>
</svg>
